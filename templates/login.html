<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-10 rounded-lg shadow-lg w-full max-w-md">

        <h1 class="text-3xl font-bold text-center mb-2">Welcome Back</h1>
        <p class="text-gray-500 text-center mb-6">
            Your financial progress is waiting for you.
        </p>

        <form method="POST" action="/login">

            <!-- Email -->
            <div class="mb-4">
                <label class="block mb-1">Email Address</label>
                <input type="email" name="email"
                    class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
                    placeholder="Enter your email">
            </div>

            <!-- Password -->
            <div class="mb-2">
                <label class="block mb-1">Password</label>

                <div class="relative">
                    <input type="password" name="password" id="login_password"
                        class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
                        placeholder="Enter password">

                    <span onclick="toggleInput('login_password')"
                        class="absolute right-3 top-2 cursor-pointer text-gray-500">
                        👁
                    </span>
                </div>
            </div>

            <!-- Forgot -->
            <div class="text-right mb-4">
                <a href="forgot" class="text-sm text-blue-500">Forgot Password?</a>
            </div>

            <!-- Button -->
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                Login to GeekWallet
            </button>

        </form>

        <p class="text-center text-sm mt-4">
            No account yet?
            <a href="/signup" class="text-blue-500">Sign Up Here</a>
        </p>

    </div>

    <script>
        function toggleInput(id) {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        }
    </script>

</body>

</html>
